;; ============================================================
;; 光屿 C01 原型固件环境
;;
;; 主线: 立创·实战派 ESP32-S3 (WROOM-1-N16R8, 16MB Flash / 8MB OPI PSRAM)
;;   灯带 DATA -> IO10 (经 330Ω)
;;   灯珠 9 列 x 23 颗 = 207, S 形走线, 1 号位在第 1 列底部, 第 1 列在最左
;;   第 46 颗(第 2 列底部)损坏 -> APP 端留黑点, 固件不跳过
;;   麦克风: 原理图为双路 ZTS6216(模拟) + ES7210 四通道 ADC
;;     I2C: SCL=IO2, SDA=IO1, addr=0x41
;;     I2S: BCK=IO14, WS=IO13, MCLK=IO38, ADC SDOUT1 -> DI=IO12
;;     ES8311(DAC, 0x18) 与 ES7210 共用 BCK/WS/MCLK, DO=IO45
;;     注意: usermod 已内置 ES7210 I2C 初始化(AR_ES7210, dmType=4, MCLK/LRCK=512)
;;   按键: 暂定 IO0/IO3/IO7; IO1 与 I2C SDA 冲突已移除, 需按实物复核
;;   串口: CH340K 接 U0TXD/U0RXD, 不走原生 USB-CDC
;;
;; 编译: 只在 GitHub Actions 执行 `pio run -e esp32lichuang`
;; 产物: artifact firmware-esp32lichuang; OTA 单文件 ColorLamp-S3-C01-ota.bin
;; 烧录: OTA POST /update (字段 update) 或 USB esptool (见工作流产物)
;; ============================================================
[platformio]
default_envs = esp32lichuang

[env:esp32lichuang]
extends = esp32s3
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
custom_usermods = audioreactive_v1 color_lamp_keys
build_unflags = ${esp32s3.build_unflags}
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${esp32s3.lib_ignore}
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  ;; ---- 产品标识 (info.brand / info.product) ----
  -D WLED_RELEASE_NAME=\"ColorLamp-S3-C01\"
  -D WLED_BRAND=\"LumiIsle\"
  -D WLED_PRODUCT_NAME=\"C01\"
  -D SERVERNAME=\"ColorLamp\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  ;; ---- 灯带 ----
  -D DATA_PINS=10
  -D PIXEL_COUNTS=207
  -D LED_TYPES=TYPE_WS2812_RGB
  -D ABL_MILLIAMPS_DEFAULT=4500
  ;; ---- 2D 矩阵 ----
  -D DEFAULT_MATRIX_W=9
  -D DEFAULT_MATRIX_H=23
  -D DEFAULT_MATRIX_VERTICAL=1
  -D DEFAULT_MATRIX_SERPENTINE=1
  -D DEFAULT_MATRIX_BOTTOM_START=1
  -D DEFAULT_MATRIX_RIGHT_START=0
  ;; ---- 按键 ----
  -D BTNPIN=0,3,7
  -D BTNTYPE=BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH
  -D RLYPIN=-1 -D IRPIN=-1
  ;; ---- 音频: ES7210 + ZTS6216 ----
  -D SR_DMTYPE=4
  -D AR_ES7210=1
  -D ES7210_ADDR=0x41
  -D ES7210_SDA=1
  -D ES7210_SCL=2
  -D I2S_SDPIN=12
  -D I2S_WSPIN=13
  -D I2S_CKPIN=14
  -D MCLK_PIN=38
  -D AUDIOPIN=-1
  -D SR_GAIN=60 -D SR_SQUELCH=10
  ;; 注意: 不定义 UM_AUDIOREACTIVE_ENABLE，音频默认关闭；驱动已内置(AR_ES7210)，
  ;; 验证通过后可由用户在设置中开启。旧设备 cfg 里的 digitalmic.type 需改为 4。

;; ============================================================
;; 历史硬件: ESP32-C3 模组 (原理图 V1.0 2026-11-23), 仅保留作对照
;;   LED_DIN_3V3 -> IO10; MIC_ADC -> IO4; KEY 0/1/3/7
;; ============================================================
[env:color_lamp_c3]
extends = esp32c3
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
upload_speed = 460800
custom_usermods = audioreactive_v1 color_lamp_keys
build_unflags = ${esp32c3.build_unflags}
lib_deps = ${esp32c3.lib_deps}
build_flags = ${common.build_flags} ${esp32c3.build_flags}
  -D WLED_RELEASE_NAME=\"ColorLamp-C3\"
  -D SERVERNAME=\"ColorLamp\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D LOLIN_WIFI_FIX
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ;; ---- 灯带 ----
  -D DATA_PINS=10
  -D PIXEL_COUNTS=207
  -D LED_TYPES=TYPE_WS2812_RGB
  -D ABL_MILLIAMPS_DEFAULT=2500
  ;; ---- 2D 矩阵 ----
  -D DEFAULT_MATRIX_W=9
  -D DEFAULT_MATRIX_H=23
  -D DEFAULT_MATRIX_VERTICAL=1
  -D DEFAULT_MATRIX_SERPENTINE=1
  -D DEFAULT_MATRIX_BOTTOM_START=1
  -D DEFAULT_MATRIX_RIGHT_START=0
  ;; ---- 按键 ----
  -D BTNPIN=0,1,3,7
  -D BTNTYPE=BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH
  -D RLYPIN=-1 -D IRPIN=-1
  ;; ---- 音频: C3 旧板的模拟麦克风, 仅历史对照 ----
  -D SR_DMTYPE=0
  -D AUDIOPIN=4
  -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D MCLK_PIN=-1
  -D SR_GAIN=60 -D SR_SQUELCH=10
