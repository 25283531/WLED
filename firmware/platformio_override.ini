;; ============================================================
;; color-lamp-96mm-cloud  (ESP32-C3 模组, 原理图 V1.0 2026-11-23)
;;   LED_DIN_3V3  -> IO10 (经 R_LED 330Ω 到灯带)
;;   MIC_ADC      -> IO4  (ADC1_CH4, GMI6050P 驻极体麦克风, 2.2k偏置 + 100k/100k 中点)
;;   KEY_POWER    -> IO0   按钮0: 短按开/关, 长按随机颜色
;;   KEY_MODE     -> IO1   按钮1: 短按下一效果, 长按调亮度
;;   KEY_BRIGHT_UP-> IO3   按钮2: 亮度+ (color_lamp_keys usermod)
;;   KEY_BRIGHT_DN-> IO7   按钮3: 亮度- (color_lamp_keys usermod)
;;   USB D-/D+    -> IO18/IO19 (原生USB-CDC)   UART0 -> IO20/IO21
;;   IO2/IO8/IO9 为启动绑定脚，未使用
;; 编译: pio run -e color_lamp_c3     烧录: pio run -e color_lamp_c3 -t upload
;; ============================================================
[platformio]
default_envs = color_lamp_c3

[env:color_lamp_c3]
extends = esp32c3
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
upload_speed = 460800
custom_usermods = audioreactive_v1 color_lamp_keys
build_unflags = ${esp32c3.build_unflags}
lib_deps = ${esp32c3.lib_deps}
build_flags = ${common.build_flags} ${esp32c3.build_flags}
  -D WLED_RELEASE_NAME=\"ColorLamp-C3\"
  -D SERVERNAME=\"ColorLamp\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D LOLIN_WIFI_FIX
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ;; ---- 灯带 ----
  -D DATA_PINS=10
  -D PIXEL_COUNTS=207           ;; 原型: 9 列 × 23 颗 = 207 (S 形绕 φ50mm 圆管); 网页 LED Preferences 也可运行期改
  -D LED_TYPES=TYPE_WS2812_RGB
  ;; 限流: 207 颗满白理论 ≈ 207x55mA ≈ 11.4A, 2500mA 会把亮度压到约 20%.
  ;; 请按实际电源容量上调 (5V/4A→3500, 5V/6A→5000, 5V/10A→9000), 不要超过电源额定值
  -D ABL_MILLIAMPS_DEFAULT=2500
  ;; ---- 2D 矩阵出厂默认 (cfg.cpp 在 cfg.json 无 matrix 时启用; 网页里改过就以 cfg.json 为准) ----
  -D DEFAULT_MATRIX_W=9           ;; 宽 = 列数
  -D DEFAULT_MATRIX_H=23          ;; 高 = 每列颗数
  -D DEFAULT_MATRIX_VERTICAL=1    ;; 关键: 1 = 先走完一列(23颗)再换列, 与物理走线一致; 配 0 会让画面整体转 90°
  -D DEFAULT_MATRIX_SERPENTINE=1  ;; S 形: 奇数列反向
  -D DEFAULT_MATRIX_BOTTOM_START=1 ;; 数据链起点在底部
  -D DEFAULT_MATRIX_RIGHT_START=0  ;; 起点在左下角; 若第一列在右侧改为 1
  ;; ---- 出厂默认灯效: 光屿招牌「极光之舞」(FX_MODE_LUMI_AURORA = 221) ----
  ;; 改成 0 即恢复 WLED 默认的 Solid
  -D DEFAULT_BOOT_FX=221
  ;; ---- 按键 (J_TOUCH 触摸模块, 高电平有效; 若为普通轻触接地按键改为 BTN_TYPE_PUSH) ----
  -D BTNPIN=0,1,3,7
  -D BTNTYPE=BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH,BTN_TYPE_PUSH_ACT_HIGH
  -D RLYPIN=-1 -D IRPIN=-1
  ;; ---- 音频律动: 模拟麦克风 ----
  -D SR_DMTYPE=0                ;; 0 = 模拟麦克风 (ADC)
  -D AUDIOPIN=4                 ;; MIC_ADC
  -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D MCLK_PIN=-1
  -D SR_GAIN=60 -D SR_SQUELCH=10
  -D UM_AUDIOREACTIVE_ENABLE     ;; 默认启用音频律动
