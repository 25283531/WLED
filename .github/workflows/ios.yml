name: iOS APP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/iosApp/**', 'app/shared/**', 'app/gradle/**', '.github/workflows/ios.yml']
    tags: ['app-v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('app/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Build shared XCFramework
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleSharedReleaseXCFramework
          ./gradlew --stop

      - name: Build app (no code signing)
        run: |
          SKIP_KMP_BUILD=1 xcodebuild build \
            -project iosApp/wled.xcodeproj \
            -scheme wled \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build/DerivedData \
            -clonedSourcePackagesDirPath iosApp/build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP=$(find iosApp/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
          cd "$GITHUB_WORKSPACE/out" && zip -qry WLED-unsigned.ipa Payload && rm -rf Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: out/*.ipa
          retention-days: 30

      - name: Publish GitHub Release (tag app-v*)
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipa
