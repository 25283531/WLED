name: Effect previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/effects_enabled.json'
      - 'tools/gen_effect_gifs.py'
      - '.github/workflows/effect-previews.yml'

permissions:
  contents: write

jobs:
  previews:
    name: Regenerate effect previews
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 避免机器人自己提交预览图后再次触发本工作流
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate previews
        run: |
          rm -f app/app/src/main/assets/effect_previews/*.gif
          python tools/gen_effect_gifs.py

      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/app/src/main/assets/effect_previews
          if git diff --cached --quiet; then
            echo "预览图无变化"
          else
            git commit -m "chore(previews): regenerate effect previews from effects_enabled.json"
            git push
          fi
