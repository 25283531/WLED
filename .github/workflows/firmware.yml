name: Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
    tags: ['fw-v*']

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firmware

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32lichuang
            artifact: firmware-esp32lichuang
            ota: ColorLamp-S3-C01-ota.bin
          - env: color_lamp_c3
            artifact: firmware-color_lamp_c3
            ota: ColorLamp-C3-ota.bin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: firmware/.nvmrc
          cache: npm
          cache-dependency-path: firmware/package-lock.json

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/platformio_override.ini') }}

      - run: pip install -r requirements.txt

      # Fail fast with an actionable message instead of "Unknown environment".
      # Product envs are defined only in firmware/platformio_override.ini.
      - name: Verify ${{ matrix.env }} environment is defined
        run: |
          if ! pio project config | grep -q 'env:${{ matrix.env }}'; then
            echo "::error::env:${{ matrix.env }} not found. firmware/platformio_override.ini must be committed."
            exit 1
          fi

      - run: pio run -e ${{ matrix.env }}

      - name: Collect binaries
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          cp "$BUILD_DIR/firmware.bin" "$GITHUB_WORKSPACE/out/${{ matrix.ota }}"
          cp "$BUILD_DIR/bootloader.bin" "$GITHUB_WORKSPACE/out/${{ matrix.env }}-bootloader.bin" 2>/dev/null || true
          cp "$BUILD_DIR/partitions.bin" "$GITHUB_WORKSPACE/out/${{ matrix.env }}-partitions.bin" 2>/dev/null || true
          cp "$BUILD_DIR/spiffs.bin" "$GITHUB_WORKSPACE/out/${{ matrix.env }}-spiffs.bin" 2>/dev/null || true
          cp "$BUILD_DIR/firmware.elf" "$GITHUB_WORKSPACE/out/${{ matrix.env }}-firmware.elf" 2>/dev/null || true
          cp build_output/release/*.bin "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/*.bin
            out/*.elf
          retention-days: 30

  release:
    name: Publish GitHub Release (tag fw-v*)
    if: startsWith(github.ref, 'refs/tags/fw-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.bin
